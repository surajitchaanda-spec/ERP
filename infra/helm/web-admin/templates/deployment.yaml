apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "erp-web-admin.fullname" . }}
  labels:
    {{- include "erp-web-admin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 2 }}
  selector:
    matchLabels:
      {{- include "erp-web-admin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "erp-web-admin.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: web-admin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "erp-web-admin.fullname" . }}
  labels:
    {{- include "erp-web-admin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "erp-web-admin.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
