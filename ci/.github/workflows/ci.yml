name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - name: Build backend container
        run: |
          docker build -t erp-backend ./platform/backend
      - name: Build web-admin container
        run: |
          docker build -t erp-web-admin ./platform/web-admin
